# This rule is not used by the project k8stest1134 itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over game.game.example.com.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: k8stest1134
    app.kubernetes.io/managed-by: kustomize
  name: gameserverset-admin-role
rules:
- apiGroups:
  - game.game.example.com
  resources:
  - gameserversets
  verbs:
  - '*'
- apiGroups:
  - game.game.example.com
  resources:
  - gameserversets/status
  verbs:
  - get
