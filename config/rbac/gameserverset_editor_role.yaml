# This rule is not used by the project k8stest1134 itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the game.game.example.com.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: k8stest1134
    app.kubernetes.io/managed-by: kustomize
  name: gameserverset-editor-role
rules:
- apiGroups:
  - game.game.example.com
  resources:
  - gameserversets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - game.game.example.com
  resources:
  - gameserversets/status
  verbs:
  - get
