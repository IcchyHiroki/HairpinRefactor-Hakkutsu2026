apiVersion: game.game.example.com/v1
kind: GameServerSet
metadata:
  name: gameserverset-sample
spec:
  replicas: 3
  deleteDelaySeconds: 27
  template:
    metadata:
      labels:
        app: web-app
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
      terminationGracePeriodSeconds: 5
