apiVersion: v1
kind: ServiceAccount
metadata:
  name: hairpin-server
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hairpin-server
  namespace: default
rules:
- apiGroups: [""]
  resources: [pods]
  verbs: [get, list, watch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hairpin-server
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hairpin-server
subjects:
- kind: ServiceAccount
  name: hairpin-server
  namespace: default
